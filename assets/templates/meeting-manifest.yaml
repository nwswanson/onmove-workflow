# Keep speaker attribution tentative unless verified.
# Extract work decisions, explicit commitments, questions and outcomes with locators.
# Do not treat every spoken suggestion as an accepted decision.
# Deduplicate reimports by meeting_uid + content_digest/version; a corrected transcript
# is a new version. Preserve older event time and actual ingestion time separately.
# Keep raw transcripts outside OnMove by default; store concise evidence with a
# durable user-accessible source reference. If none exists, retain enough attributed
# excerpt/locator to support material claims and declare the retrieval limitation.
